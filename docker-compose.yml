services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  ganache:
    image: trufflesuite/ganache:v7.9.2
    command: ["--host", "0.0.0.0", "--wallet.totalAccounts", "10", "--chain.chainId", "1337"]
    ports: ["8545:8545"]
  ai:
    build: ./services/ai
    ports: ["8001:8001"]
  api:
    build: ./services/api
    environment:
      MONGODB_URI: mongodb://mongodb:27017/renthub
      AI_SERVICE_URL: http://ai:8001
    ports: ["3000:3000"]
    depends_on: [mongodb, ai]
volumes:
  mongo_data:

