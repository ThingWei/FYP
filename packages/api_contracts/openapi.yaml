openapi: 3.0.3
info: { title: RentHub API, version: 1.0.0 }
servers: [{ url: http://localhost:3000/api/v1 }]
paths:
  /health:
    get:
      responses: { '200': { description: Healthy } }
  /users/local-login:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: Signed access token, rotating refresh token, and user profile }, '401': { description: Invalid credentials } }
  /users/local-register:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationRequest' } } } }
      responses: { '201': { description: Account created with signed local session }, '409': { description: Email already registered } }
  /users/local-refresh:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses: { '200': { description: Rotated refresh token and new access token }, '401': { description: Refresh session invalid, expired, or revoked } }
  /users/local-logout:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Current local session revoked }, '401': { description: Access token invalid or session revoked } }
  /users/me/sessions:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Active local login sessions with the current session identified } }
  /users/me/sessions/revoke-others:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Every local login session except the current one revoked } }
  /users/me/sessions/{sessionId}:
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Selected login session revoked }
        '409': { description: Current session must use the logout endpoint }
  /users/local-password-reset/request:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '200': { description: Generic password-reset email response }
        '503': { description: Reset-email provider is not configured }
  /users/local-password-reset/confirm:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmation' }
      responses:
        '200': { description: Password updated and reset code consumed }
        '400': { description: Reset code is invalid, expired, or exhausted }
  /users/session:
    post:
      security: [{ bearerAuth: [] }]
      description: Synchronizes a verified identity. Public identities are normalized to exactly renter and owner; administrators remain admin-only. Mixed administrator/marketplace claims are rejected.
      responses:
        '200': { description: Existing synchronized user profile, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/UserProfile' } } } } } }
        '201': { description: New synchronized user profile, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/UserProfile' } } } } } }
        '403': { description: Contradictory role claims or restricted account }
  /users/me/active-role:
    patch:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties: { role: { type: string, enum: [renter, owner] } }
      responses:
        '200': { description: Marketplace starting interface persisted, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/UserProfile' } } } } } }
        '403': { description: Role switching is not available to administrator accounts }
  /rewards/summary:
    get:
      security: [{ bearerAuth: [] }]
      description: Returns points, reward ledger and explicit referral progress. Loading this summary safely reconciles eligible pending referrals.
      responses:
        '200': { description: Loyalty and referral summary, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/LoyaltySummary' } } } } } }
  /rewards/referrals/apply:
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [referralCode]
              additionalProperties: false
              properties: { referralCode: { type: string } }
      responses:
        '201': { description: Pending referral with first-completed-booking trigger and next action }
        '400': { description: SELF_REFERRAL }
        '404': { description: Referral code not found }
        '409': { description: REFERRAL_EXISTS, REFERRAL_WINDOW_ENDED, or LOYALTY_DISABLED }
  /listings:
    get:
      responses: { '200': { description: Paginated listings } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Listing created } }
  /listings/recommended:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: category, schema: { type: string, enum: [Clothing, Vehicles, Devices, Books, Equipment] } }
        - { in: query, name: type, schema: { type: string, enum: [physical, service] } }
        - { in: query, name: location, schema: { type: string, maxLength: 100 } }
        - { in: query, name: verified, schema: { type: boolean } }
        - { in: query, name: promoted, schema: { type: boolean } }
        - { in: query, name: minPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: maxPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: availableFrom, schema: { type: string, format: date-time } }
        - { in: query, name: availableTo, schema: { type: string, format: date-time } }
      responses: { '200': { description: Personalized hybrid-ranked listings or an explicitly labelled fallback } }
  /listings/{listingId}/availability:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: listingId, required: true, schema: { type: string } }
      responses:
        '200':
          description: Owner blackouts and hard booking occupancy merged into the listing availability policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ListingAvailability' }
  /listings/price-recommendation:
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceRecommendationRequest' }
      responses:
        '200':
          description: Artifact-backed XGBoost recommendation, labelled statistical fallback, or unavailable state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PriceRecommendation' }
  /catalog/brands:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: category, required: true, schema: { type: string } }
        - { in: query, name: subcategory, required: true, schema: { type: string } }
        - { in: query, name: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200': { description: Cached or provider-backed brand suggestions }
        '503': { description: Catalog provider unavailable and no cached results exist }
  /catalog/models:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: category, required: true, schema: { type: string } }
        - { in: query, name: subcategory, required: true, schema: { type: string } }
        - { in: query, name: brand, required: true, schema: { type: string } }
        - { in: query, name: query, schema: { type: string, minLength: 2 } }
        - { in: query, name: catalogBrandId, schema: { type: string } }
      responses:
        '200': { description: Brand-filtered cached or provider-backed model suggestions }
        '503': { description: Catalog provider unavailable and no cached results exist }
  /catalog/search:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: category, required: true, schema: { type: string } }
        - { in: query, name: subcategory, required: true, schema: { type: string } }
        - { in: query, name: query, required: true, schema: { type: string, minLength: 2 } }
        - { in: query, name: brand, schema: { type: string } }
      responses:
        '200': { description: General product-catalog suggestions }
        '503': { description: Catalog provider unavailable and no cached results exist }
  /bookings:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Booking created } }
  /messages/threads/{threadId}/messages:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: threadId, required: true, schema: { type: string } }
      responses: { '200': { description: Conversation messages, including protected image metadata } }
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: threadId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201': { description: Text or protected-image message created and emitted through Socket.IO }
        '400': { description: Attachment is invalid, unowned, or has the wrong purpose }
        '403': { description: Sender is blocked or is not a conversation participant }
  /messages/push/devices:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Current user's registered push devices } }
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushDeviceRequest' }
      responses:
        '200': { description: Device token registered or rotated }
        '422': { description: Invalid device registration }
  /messages/push/devices/{deviceId}:
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: deviceId, required: true, schema: { type: string } }
      responses: { '200': { description: Device registration removed } }
  /users/me/deactivate:
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountDeactivationRequest' }
      responses:
        '200': { description: Account deactivated and active sessions revoked }
        '400': { description: Confirmation or reason is invalid }
        '409': { description: Open obligations or final administrator safeguard }
  /users/{userId}/status:
    patch:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountStatusRequest' }
      responses:
        '200': { description: Account status updated with an audit record }
        '403': { description: Administrator role required }
  /admin/reporting/reports:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Generated report metadata } }
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReportGenerationRequest' }
      responses:
        '200': { description: CSV report generated }
        '403': { description: Administrator role required }
  /admin/reporting/reports/{reportId}/download:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: reportId, required: true, schema: { type: string } }
      responses:
        '200': { description: Authenticated CSV file payload }
        '404': { description: Report not found }
  /admin/reporting/schedules:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Report schedules } }
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReportScheduleRequest' }
      responses: { '200': { description: Report schedule created } }
  /admin/reporting/schedules/{scheduleId}:
    patch:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: scheduleId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReportScheduleUpdate' }
      responses:
        '200': { description: Report schedule updated }
        '404': { description: Report schedule not found }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    UserProfile:
      type: object
      required: [authId, email, displayName, roles, activeRole]
      properties:
        authId: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        roles:
          type: array
          description: Exactly [renter, owner] for a marketplace account or [admin] for an administrator.
          items: { type: string, enum: [renter, owner, admin] }
        activeRole: { type: string, enum: [renter, owner, admin] }
    ReferralProgress:
      type: object
      required: [id, referralCode, status, appliedAt, completionTrigger, progressState, nextAction, nextActionMessage, refereeRewardAmount]
      properties:
        id: { type: string }
        referralCode: { type: string }
        status: { type: string, enum: [pending, rewarded] }
        appliedAt: { type: string, format: date-time }
        rewardedAt: { type: string, format: date-time, nullable: true }
        qualifyingBookingId: { type: string, nullable: true }
        qualifyingCompletedAt: { type: string, format: date-time, nullable: true }
        refereeRewardAmount: { type: number, minimum: 0 }
        completionTrigger: { type: string, enum: [first_completed_booking] }
        progressState: { type: string, enum: [waiting_for_booking, waiting_for_completion, programme_paused, eligible_for_reconciliation, invalid_application, rewarded] }
        nextAction: { type: string, enum: [browse_listings, view_booking, wait_for_programme, view_reward, none] }
        nextActionMessage: { type: string }
    LoyaltySummary:
      type: object
      required: [points, referralCode, totalEarned, totalRedeemed, ledger, redemptionOptions, canApplyReferral, rules]
      properties:
        points: { type: integer, minimum: 0 }
        referralCode: { type: string }
        totalEarned: { type: integer, minimum: 0 }
        totalRedeemed: { type: integer, minimum: 0 }
        ledger: { type: array, items: { type: object, additionalProperties: true } }
        redemptionOptions: { type: array, items: { type: object, additionalProperties: true } }
        referral:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ReferralProgress' }]
        canApplyReferral: { type: boolean }
        rules: { type: object, additionalProperties: true }
    ListingUnavailableRange:
      type: object
      required: [start, end, source, allDay]
      properties:
        start: { type: string, format: date-time }
        end:
          type: string
          format: date-time
          description: Exclusive range end. A physical booking ending on 22 September is returned as 23 September 00:00.
        source: { type: string, enum: [owner_blackout, booking] }
        reason: { type: string, nullable: true }
        allDay: { type: boolean }
    ListingAvailability:
      type: object
      required: [listingId, weeklyHours, unavailableRanges, manualUnavailableRanges, bufferHours, minimumNoticeHours]
      properties:
        listingId: { type: string }
        weeklyHours: { type: array, items: { type: object, additionalProperties: true } }
        unavailableRanges:
          type: array
          description: Combined owner blackouts and approved, active, or qualifying disputed booking occupancy.
          items: { $ref: '#/components/schemas/ListingUnavailableRange' }
        manualUnavailableRanges:
          type: array
          description: Owner-authored blackouts only; used by the Owner editor to avoid persisting booking-derived ranges.
          items: { $ref: '#/components/schemas/ListingUnavailableRange' }
        bufferHours: { type: number, minimum: 0 }
        minimumNoticeHours: { type: number, minimum: 0 }
        nextAvailableDate: { type: string, format: date-time, nullable: true }
    PriceRecommendationRequest:
      type: object
      required: [itemProfile]
      additionalProperties: false
      properties:
        excludeListingId: { type: string, pattern: '^l-[a-zA-Z0-9-]+$' }
        rentalDurationDays: { type: integer, minimum: 1, maximum: 365 }
        itemProfile:
          type: object
          required: [category, condition]
          properties:
            category: { type: string, enum: [Clothing, Vehicles, Devices, Books, Equipment] }
            subcategory: { type: string, maxLength: 100 }
            condition: { type: string, enum: [Fair, Good, Very good, Excellent, Like New] }
            brand: { type: string, maxLength: 100 }
            product_model: { type: string, maxLength: 120 }
            canonicalProductId: { type: string, nullable: true, maxLength: 160 }
            catalogBrandId: { type: string, nullable: true, maxLength: 160 }
            productMatchType:
              type: string
              enum: [exact_catalog_match, fuzzy_catalog_match, manual_entry, catalog_brand_match_model_manual]
            catalogSource: { type: string, nullable: true, maxLength: 80 }
            location: { type: string, maxLength: 160 }
            state: { type: string, maxLength: 80 }
            item_age_years: { type: number, minimum: 0, maximum: 100 }
    PriceRecommendation:
      type: object
      required: [available, confidence, confidence_label, currency, model_source, evidence, explanation, warnings]
      properties:
        available: { type: boolean }
        suggested_daily_price: { type: number, nullable: true, minimum: 0 }
        lower_bound: { type: number, nullable: true, minimum: 0 }
        upper_bound: { type: number, nullable: true, minimum: 0 }
        currency: { type: string, enum: [MYR] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidence_label: { type: string, enum: [low, medium, high] }
        model_source:
          type: string
          enum: [category_xgboost, global_xgboost, completed_rental_median, active_listing_median, unavailable, incompatible_schema, insufficient_data]
        model_version: { type: string, nullable: true }
        evidence: { type: object, additionalProperties: true }
        product_match:
          type: object
          properties:
            type:
              type: string
              enum: [exact_catalog_match, fuzzy_catalog_match, manual_entry, catalog_brand_match_model_manual]
            brand: { type: string }
            model: { type: string }
            canonicalProductId: { type: string, nullable: true }
            source: { type: string, nullable: true }
        explanation: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        evaluation: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
    LoginRequest:
      type: object
      required: [email, password, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { type: string, enum: [renter, owner, admin] }
    RegistrationRequest:
      type: object
      required: [displayName, email, password, role]
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { type: string, enum: [renter, owner] }
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken: { type: string, minLength: 40, maxLength: 500 }
    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
    PasswordResetConfirmation:
      type: object
      required: [email, code, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }
        password: { type: string, minLength: 8, maxLength: 128 }
    PushDeviceRequest:
      type: object
      required: [deviceId, platform, token]
      additionalProperties: false
      properties:
        deviceId: { type: string, minLength: 8, maxLength: 120 }
        deviceName: { type: string, maxLength: 120 }
        platform: { type: string, enum: [android, ios, macos, web] }
        token: { type: string, minLength: 20, maxLength: 4096 }
    SendMessageRequest:
      type: object
      additionalProperties: false
      description: At least one of text or attachmentRef is required.
      properties:
        text: { type: string, maxLength: 2000 }
        attachmentRef:
          type: string
          pattern: '^upload://UPL-[A-Z0-9]+$'
          description: Private upload created with purpose message_image.
    AccountDeactivationRequest:
      type: object
      required: [confirmation, reason]
      additionalProperties: false
      properties:
        confirmation: { type: boolean, enum: [true] }
        reason: { type: string, minLength: 5, maxLength: 500 }
    AccountStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, deactivated, suspended, banned]
        reason: { type: string, maxLength: 500 }
    AdminReportGenerationRequest:
      type: object
      required: [reportType]
      properties:
        reportType:
          type: string
          enum: [platform_summary, bookings, payments, users, listings, disputes]
        rangeDays: { type: integer, minimum: 1, maximum: 365, default: 30 }
    AdminReportScheduleRequest:
      type: object
      required: [name, reportType, cadence]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        reportType:
          type: string
          enum: [platform_summary, bookings, payments, users, listings, disputes]
        cadence: { type: string, enum: [daily, weekly, monthly] }
        rangeDays: { type: integer, minimum: 1, maximum: 365, default: 30 }
        enabled: { type: boolean, default: true }
        nextRunAt: { type: string, format: date-time }
    AdminReportScheduleUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        reportType:
          type: string
          enum: [platform_summary, bookings, payments, users, listings, disputes]
        cadence: { type: string, enum: [daily, weekly, monthly] }
        rangeDays: { type: integer, minimum: 1, maximum: 365 }
        enabled: { type: boolean }
        nextRunAt: { type: string, format: date-time }

